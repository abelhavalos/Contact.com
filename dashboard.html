<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyFafzkgdxhvXuNaPyzNZw0ZKu1qZsoH7A34OuSAtMBhm3TIZrOBJsvH3AGQT9YSmjx/exec";

/* ------------------ NAVBAR + USER LOADING ------------------ */

function toggleMenu() {
    document.getElementById("mobileMenu").classList.toggle("show");
}

document.addEventListener("DOMContentLoaded", () => {
    const user = JSON.parse(localStorage.getItem("contact_user"));
    if (!user) {
        window.location.href = "login.html";
        return;
    }

    document.getElementById("userName").textContent = user.fullName;
    loadNavbar();

    setTimeout(() => {
        updateNotificationBubble();
        setInterval(updateNotificationBubble, 3000);
    }, 200);
});

function loadNavbar() {
    const user = JSON.parse(localStorage.getItem("contact_user"));

    const loggedInNav = `
        <div class="hamburger" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </div>
        <div class="logo">
            Contact<span>.</span>com
            <div id="notifBubble" class="notification-bubble hidden">0</div>
        </div>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="communities.html">Communities</a>
            <a href="events.html">Events</a>
            <a href="contacts.html">Contacts</a>
            <a href="profile.html">Profile</a>
            <a href="#" onclick="logout()">Logout</a>
        </div>
    `;

    const publicNav = `
        <div class="hamburger" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </div>
        <div class="logo">Contact<span>.</span>com</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="communities.html">Communities</a>
            <a href="events.html">Events</a>
            <a href="login.html">Login</a>
            <button class="btn-primary" onclick="window.location.href='signup.html'">Sign Up</button>
        </div>
    `;

    document.getElementById("navbar").innerHTML = user ? loggedInNav : publicNav;

    document.getElementById("mobileMenu").innerHTML = user
        ? `
            <a href="dashboard.html">Dashboard</a>
            <a href="communities.html">Communities</a>
            <a href="events.html">Events</a>
            <a href="contacts.html">Contacts</a>
            <a href="profile.html">Profile</a>
            <a href="#" onclick="logout()">Logout</a>
        `
        : `
            <a href="index.html">Home</a>
            <a href="communities.html">Communities</a>
            <a href="events.html">Events</a>
            <a href="login.html">Login</a>
            <button class="btn-primary" onclick="window.location.href='signup.html'">Sign Up</button>
        `;
}

function logout() {
    localStorage.removeItem("contact_user");
    window.location.href = "index.html";
}

/* ------------------ NOTIFICATION BUBBLE ------------------ */

async function updateNotificationBubble() {
    const user = JSON.parse(localStorage.getItem("contact_user"));
    if (!user) return;

    try {
        const r = await fetch(`${API_URL}?module=getNotifications&email=${user.email}`);
        const data = await r.json();

        const unread = (data.notifications || []).filter(n => !n.read).length;

        const bubble = document.getElementById("notifBubble");
        if (!bubble) return;

        if (unread > 0) {
            bubble.textContent = unread;
            bubble.classList.remove("hidden");
        } else {
            bubble.classList.add("hidden");
        }
    } catch (err) {
        console.error("Notification bubble error:", err);
    }
}

/* ------------------ NOTIFICATION PANEL ------------------ */

function renderNotifications(list) {
    const panel = document.getElementById("notificationsPanel");
    panel.innerHTML = "";

    if (list.length === 0) {
        panel.innerHTML = `<div style="padding:10px;">No notifications</div>`;
        return;
    }

    const currentUser = JSON.parse(localStorage.getItem("contact_user")).email;

    list.forEach(n => {
        let senderEmail = null;

        if (n.link && n.link.includes("conversationId=")) {
            const convId = n.link.split("conversationId=")[1];
            const parts = convId.replace("conv_", "").split("_");

            const email1 = parts[0];
            const email2 = parts[1];

            senderEmail = (email1 === currentUser) ? email2 : email1;
        }

        panel.innerHTML += `
            <div class="notification-item"
                 onclick="handleNotificationClick('${senderEmail}', '${n.email}', '${n.link}')">
                <div class="notification-text">${n.text}</div>
                <div class="notification-time">${new Date(n.timestamp).toLocaleString()}</div>
            </div>
        `;
    });
}

/* ------------------ PANEL TOGGLE ------------------ */

document.addEventListener("click", async (e) => {
    const bubble = document.getElementById("notifBubble");
    const panel = document.getElementById("notificationsPanel");

    if (e.target === bubble) {
        const user = JSON.parse(localStorage.getItem("contact_user"));
        const r = await fetch(`${API_URL}?module=getNotifications&email=${user.email}`);
        const data = await r.json();

        renderNotifications(data.notifications || []);
        panel.style.display = panel.style.display === "none" || panel.style.display === "" ? "block" : "none";
        return;
    }

    if (!panel.contains(e.target)) {
        panel.style.display = "none";
    }
});

/* ------------------ PRIVATE CHAT REDIRECT ------------------ */

function messageUser(email) {
    window.location.href = `messages.html?otherEmail=${encodeURIComponent(email)}`;
}

/* ------------------ MARK AS READ + REFRESH + OPEN CHAT ------------------ */

async function handleNotificationClick(senderEmail, receiverEmail, link) {
    await fetch(
        `${API_URL}?module=markNotificationRead&email=${encodeURIComponent(receiverEmail)}&link=${encodeURIComponent(link)}`
    );

    updateNotificationBubble();

    const r = await fetch(`${API_URL}?module=getNotifications&email=${receiverEmail}`);
    const data = await r.json();
    renderNotifications(data.notifications || []);

    messageUser(senderEmail);
}
</script>
