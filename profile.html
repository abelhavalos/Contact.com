<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact.com – Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        <link rel="stylesheet" href="styles/profile.css"/>
    </style>
</head>

<body>
<div id="profileLoader" class="profile-loader">
  <div class="spinner"></div>
  <div class="loading-text" style="color: white; margin-top: 15px; font-weight: 600;">Updating...</div>
</div>

<div id="menuOverlay" class="menu-overlay" onclick="toggleMenu()"></div>

<nav class="navbar" id="navbar"></nav>
<div class="mobile-menu" id="mobileMenu"></div>

<div class="hero">
    <h1 id="fullNameDisplay">Loading...</h1>
    <p id="professionDisplay">Please wait</p>
</div>

<div class="section" style="text-align:center;">
    <div style="position: relative; display: inline-block;">
        <img id="profilePicPreview" 
             src="https://via.placeholder.com/120?text=User" 
             style="width:130px; height:130px; border-radius:50%; object-fit:cover; cursor:pointer; border: 4px solid #4a6cff;" />
    </div>
    <input type="file" id="profilePicFileInput" accept="image/*" style="display:none;" />
    <p style="margin-top:12px; color:#4a6cff; font-weight:700; font-size: 0.9rem; cursor: pointer;" onclick="document.getElementById('profilePicFileInput').click()">
        CHANGE PROFILE PHOTO
    </p>
</div>

<div class="section">
    <h2>Full Name</h2>
    <input id="fullName" disabled />
</div>

<div class="section">
    <h2>Profession</h2>
    <input id="profession" disabled />
</div>

<div class="section">
    <h2>About Me</h2>
    <textarea id="about" rows="4" disabled></textarea>
</div>

<div class="section">
    <h2>Skills</h2>
    <input id="skills" disabled placeholder="e.g. Design, Coding, Management" />
</div>

<div class="section">
    <h2>Work & Life</h2>
    <textarea id="workLife" rows="4" disabled></textarea>
</div>

<div class="section" style="text-align:center; background: transparent; box-shadow: none;">
    <button id="editBtn" onclick="enableEditing()" style="width: 100%; font-size: 1.1rem;">Edit Profile</button>
    <button id="saveBtn" onclick="saveProfile()" style="display:none; width: 100%; font-size: 1.1rem; background: #28a745;">Save Changes</button>
</div>

<div class="section">
    <h2>Update Email</h2>
    <input id="newEmail" type="email" placeholder="New Email Address" />
    <button onclick="changeEmail()">Update Email</button>
</div>

<div class="section">
    <h2>Update Password</h2>
    <input id="newPassword" type="password" placeholder="New Password" />
    <input id="confirmPassword" type="password" placeholder="Confirm Password" style="margin-top:10px;" />
    <button onclick="changePassword()">Update Password</button>
</div>

<div class="section" style="border: 2px solid #ff4d4d;">
    <h2 style="color:#d9534f;">Danger Zone</h2>
    <p style="font-size: 0.9rem; color: #666;">Deleting your account is permanent.</p>
    <button style="background:#d9534f; width: 100%;" onclick="showDeleteConfirm()">Delete Account</button>
</div>

<div id="popupBackdrop" class="popup-backdrop">
    <div id="deleteConfirmPopup" class="popup" style="display:none;">
        <h3 style="margin-bottom:10px;">Are you sure?</h3>
        <p style="margin-bottom:20px; color: #666;">All your data will be wiped from our servers.</p>
        <button onclick="confirmDeleteAccount()" style="background:#d9534f;">Yes, Delete</button>
        <button onclick="hideDeleteConfirm()" style="background:#ccc; color: #333;">Cancel</button>
    </div>

    <div id="mainPopup" class="popup" style="display:none;">
        <h3 id="popupTitle"></h3>
        <p id="popupMessage" style="margin: 15px 0; color: #666;"></p>
        <button onclick="hidePopup()" style="width: 100%;">Got it</button>
    </div>
</div>

<script src="scripts/profile.js"></script>
</body>
</html>
