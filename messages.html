<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Messages – Contact.com</title>
    <link rel="stylesheet" href="styles/messages.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* GLOBAL RESET */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Inter", sans-serif; }
        
        body { 
            background: #f0f2f5; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }

        /* HEADER PERSISTENCE */
        #header {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: #fff;
            border-bottom: 1px solid #eee;
            position: relative;
            z-index: 1010; /* Higher than everything else */
        }

        #headerTitle { font-weight: 700; color: #222; }

        .mobile-toggle {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid #ddd;
            background: #fff;
            cursor: pointer;
            font-weight: 600;
            color: #4a6cff;
            transition: all 0.2s;
        }

        .mobile-toggle.active {
            background: #4a6cff;
            color: #fff;
            border-color: #4a6cff;
        }

        /* INPUT AREA */
        #input-area {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px;
            border-top: 1px solid #ddd;
            background: #fff;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            opacity: 0.6;
            transition: 0.2s;
        }

        .icon-btn:hover { opacity: 1; transform: scale(1.1); }

        #messageInput {
            flex: 1;
            padding: 12px 15px;
            border-radius: 20px;
            border: 1px solid #ddd;
            outline: none;
        }

        #sendBtn {
            background: #4a6cff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
        }

        /* AVATARS */
        .chat-avatar, .chat-avatar-fallback, .msg-avatar, .member-row img {
            width: 44px !important;
            height: 44px !important;
            border-radius: 50% !important;
            object-fit: cover !important;
            flex-shrink: 0;
        }

        .chat-avatar-fallback {
            background: #dbe4ff;
            color: #4a6cff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        /* CHAT CONTAINER LAYOUT */
        #chat-container {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        #chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fff;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f9fafb;
        }

        /* SIDEBAR DEFAULT (Desktop) */
        #memberSidebar {
            width: 300px;
            border-left: 1px solid #ddd;
            background: #fff;
            overflow-y: auto;
            padding: 20px;
            transition: right 0.3s ease;
        }

        /* MOBILE SIDEBAR FIX */
        @media (max-width: 768px) {
            #memberSidebar {
                position: absolute;
                right: -100%;
                top: 0;
                bottom: 0;
                width: 280px;
                z-index: 1000; /* Lower than Header */
                box-shadow: -5px 0 15px rgba(0,0,0,0.1);
            }
            #memberSidebar.active {
                right: 0;
            }
        }

        /* LOADER */
        .chat-loader {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 2000;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid rgba(74, 108, 255, 0.2);
            border-top-color: #4a6cff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
/* GLOBAL LAYOUT FIX */
html, body {
    height: 100%;
    margin: 0;
    overflow: hidden; /* Prevents the whole page from scrolling */
}

body {
    display: flex;
    flex-direction: column; /* Stacks Navbar, Header, and Chat vertically */
}

/* NAVBAR & HEADER - Fixed heights */
.navbar {
    height: 70px;
    flex-shrink: 0;
}

#header {
    height: 60px;
    flex-shrink: 0;
    z-index: 1010;
}

/* CHAT CONTAINER - The "Magic" part */
#chat-container {
    flex: 1; /* Takes up all remaining vertical space */
    display: flex;
    overflow: hidden; /* Keeps the sidebar and chat area contained */
    position: relative;
}

#chat {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100%; /* Fill the container */
}

/* MESSAGES AREA - Scrollable */
#messages {
    flex: 1; /* Grows to fill space, pushing input to bottom */
    overflow-y: auto;
    padding: 20px;
    -webkit-overflow-scrolling: touch; /* Smooth scroll for iOS */
}

/* INPUT AREA - Always at the bottom */
#input-area {
    height: 70px; /* Fixed height for consistency */
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 15px;
    border-top: 1px solid #ddd;
    background: #fff;
}

        
    </style>
</head>

<body>

<nav class="navbar" id="navbar"></nav>
<div class="mobile-menu" id="mobileMenu"></div>

<div id="header">
    <span id="headerTitle">Loading...</span>
    <button id="toggleMembers" class="mobile-toggle">Members</button>
</div>

<div id="chatLoader" class="chat-loader">
    <div class="spinner"></div>
    <div style="margin-top: 10px; color: #4a6cff; font-weight: 600;">Loading conversation...</div>
</div>

<div id="chat-container">
    <div id="chat">
        <div id="messages">
            <div id="messageList"></div>
        </div>

        <div id="input-area">
            <button id="uploadDocBtn" class="icon-btn" title="Documents">📎</button>
            <input type="file" id="docInput" accept=".pdf,.doc,.docx,.xls,.xlsx,.txt" style="display:none">

            <button id="uploadImgBtn" class="icon-btn" title="Images">🖼️</button>
            <input type="file" id="imgInput" accept="image/*" style="display:none">

            <input id="messageInput" placeholder="Type a message..." autocomplete="off" />
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <div id="memberSidebar">
        </div>
</div>

<script src="scripts/messages.js"></script>
<script>
    // 1. File Upload Triggers
    document.getElementById('uploadDocBtn').onclick = () => document.getElementById('docInput').click();
    document.getElementById('uploadImgBtn').onclick = () => document.getElementById('imgInput').click();

    // 2. Member Sidebar Toggle Logic
    const toggleBtn = document.getElementById('toggleMembers');
    const sidebar = document.getElementById('memberSidebar');

    toggleBtn.onclick = (e) => {
        e.stopPropagation();
        const isActive = sidebar.classList.toggle('active');
        toggleBtn.classList.toggle('active');
        toggleBtn.innerText = isActive ? "Close" : "Members";
    };

    // 3. Close Sidebar when clicking the chat window
    document.getElementById('messages').onclick = () => {
        if (sidebar.classList.contains('active')) {
            sidebar.classList.remove('active');
            toggleBtn.classList.remove('active');
            toggleBtn.innerText = "Members";
        }
    };

    // 4. Prevent sidebar from closing if you click inside it
    sidebar.onclick = (e) => e.stopPropagation();
</script>

</body>
</html>
