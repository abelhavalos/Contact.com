<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Messages – Contact.com</title>
    <link rel="stylesheet" href="styles/messages.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* GLOBAL RESET */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Inter", sans-serif; }
        
        body { background: #f0f2f5; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* INPUT AREA FIXES */
        #input-area {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px;
            border-top: 1px solid #ddd;
            background: #fff;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            opacity: 0.6;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover { opacity: 1; transform: scale(1.1); }

        #messageInput {
            flex: 1;
            padding: 12px 15px;
            border-radius: 20px;
            border: 1px solid #ddd;
            outline: none;
            font-size: 14px;
        }

        #sendBtn {
            background: #4a6cff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
        }

        /* LOADER */
        .chat-loader {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 9999;
        }

        .chat-loader .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(74, 108, 255, 0.2);
            border-top-color: #4a6cff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* AVATAR SYSTEM - Consistent 44px sizing */
        .chat-avatar,
        .chat-avatar-fallback,
        .msg-avatar,
        .member-row img,
        .chat-header img {
            width: 44px !important;
            height: 44px !important;
            border-radius: 50% !important;
            object-fit: cover !important;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-avatar-fallback {
            background: #dbe4ff;
            color: #4a6cff;
            font-weight: 600;
            font-size: 16px;
        }

        /* MOBILE FIXES */
        @media (max-width: 768px) {
            #memberSidebar {
                position: fixed;
                right: -100%;
                top: 70px;
                bottom: 0;
                width: 280px;
                background: white;
                transition: 0.3s ease;
                z-index: 100;
                box-shadow: -5px 0 15px rgba(0,0,0,0.1);
            }
            #memberSidebar.active { right: 0; }
        }
    </style>
</head>

<body>

<nav class="navbar" id="navbar"></nav>
<div class="mobile-menu" id="mobileMenu"></div>

<div id="header" style="height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: #fff; border-bottom: 1px solid #eee;">
    <span id="headerTitle" style="font-weight: 700; color: #222;">...</span>
    <button id="toggleMembers" class="mobile-toggle" style="padding: 8px 15px; border-radius: 8px; border: 1px solid #ddd; background: #fff; cursor: pointer; font-weight: 600;">Members</button>
</div>

<div id="chatLoader" class="chat-loader">
    <div class="spinner"></div>
    <div class="loading-text" style="margin-top: 10px; color: #4a6cff; font-weight: 600;">Loading conversation...</div>
</div>

<div id="chat-container" style="flex: 1; display: flex; overflow: hidden;">
    <div id="chat" style="flex: 1; display: flex; flex-direction: column;">
        <div id="messages" style="flex: 1; overflow-y: auto; padding: 20px;">
            <div id="messageList"></div>
        </div>

        <div id="input-area">
            <button id="uploadDocBtn" class="icon-btn" title="Upload Document">📎</button>
            <input type="file" id="docInput" accept=".pdf,.doc,.docx,.xls,.xlsx,.txt" style="display:none">

            <button id="uploadImgBtn" class="icon-btn" title="Upload Image">🖼️</button>
            <input type="file" id="imgInput" accept="image/*" style="display:none">

            <input id="messageInput" placeholder="Type a message..." autocomplete="off" />
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <div id="memberSidebar" style="width: 300px; border-left: 1px solid #ddd; background: #fff; overflow-y: auto; padding: 20px;">
        </div>
</div>

<script src="scripts/messages.js"></script>

<script>
    // Essential UI Interactivity
    document.getElementById('uploadDocBtn').onclick = () => document.getElementById('docInput').click();
    document.getElementById('uploadImgBtn').onclick = () => document.getElementById('imgInput').click();

    // Toggle Members Sidebar on Mobile
    document.getElementById('toggleMembers').onclick = () => {
        document.getElementById('memberSidebar').classList.toggle('active');
    };

    // Close sidebar when clicking message area on mobile
    document.getElementById('messages').onclick = () => {
        document.getElementById('memberSidebar').classList.remove('active');
    };

    // Example handler for file selection (optional, logic usually in messages.js)
    document.getElementById('imgInput').onchange = (e) => {
        if(e.target.files.length > 0) {
            alert("Image ready to upload: " + e.target.files[0].name);
        }
    };
</script>

</body>
</html>
