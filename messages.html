<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Messages – Contact.com</title>
    
    <link rel="stylesheet" href="styles/messages.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* CRITICAL LAYOUT OVERRIDES */
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden; /* Prevent body scroll */
            display: flex;
            flex-direction: column;
        }

        /* Ensure Navbar and Header occupy fixed space */
        .navbar { height: 70px; flex-shrink: 0; }
        #header { height: 60px; flex-shrink: 0; z-index: 1010; }

        /* Main container fills remaining height */
        #chat-container {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        #chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #f9fafb;
        }

        /* Message area handles its own scroll */
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            scroll-behavior: smooth;
        }

        /* Sidebar Styling */
        #memberSidebar {
            width: 300px;
            background: #fff;
            border-left: 1px solid #eee;
            overflow-y: auto;
            flex-shrink: 0;
        }

        /* UI State: Loader Overlay */
        .chat-loader {
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.8);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4a6cff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Button & Icon Styling */
        .icon-btn { font-size: 20px; cursor: pointer; background: none; border: none; padding: 5px; transition: 0.2s; }
        .icon-btn:hover { transform: scale(1.1); }
        .mobile-toggle { cursor: pointer; }
    </style>
</head>

<body>

<nav class="navbar" id="navbar"></nav>
<div class="mobile-menu" id="mobileMenu"></div>

<div id="header">
    <div id="headerTitle">Loading...</div>
    <button id="toggleMembers" class="mobile-toggle" style="display:none;">Members</button>
</div>

<div id="chatLoader" class="chat-loader">
    <div class="spinner"></div>
    <div style="margin-top: 15px; color: #4a6cff; font-weight: 600;">Connecting...</div>
</div>

<main id="chat-container">
    <div id="chat">
        <div id="messages">
            <div id="messageList"></div>
        </div>

        <div id="input-area">
            <button id="uploadDocBtn" class="icon-btn" title="Documents">📎</button>
            <input type="file" id="docInput" accept=".pdf,.doc,.docx,.xls,.xlsx,.txt" style="display:none">

            <button id="uploadImgBtn" class="icon-btn" title="Images">🖼️</button>
            <input type="file" id="imgInput" accept="image/*" style="display:none">

            <input id="messageInput" placeholder="Type a message..." autocomplete="off" disabled />
            <button id="sendBtn" disabled>Send</button>
        </div>
    </div>

    <aside id="memberSidebar">
        </aside>
</main>

<script src="scripts/messages.js"></script>

<script>
    /**
     * DOM EVENT HANDLERS
     * Note: These are small UI-specific listeners. 
     * Heavy logic remains in messages.js
     */

    // Sidebar Visibility Logic (Mobile)
    const toggleBtn = document.getElementById('toggleMembers');
    const sidebar = document.getElementById('memberSidebar');
    const messagesArea = document.getElementById('messages');

    if (toggleBtn) {
        toggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isActive = sidebar.classList.toggle('active');
            toggleBtn.innerText = isActive ? "Close" : "Members";
        });
    }

    // Auto-close sidebar on mobile when clicking the chat area
    messagesArea.addEventListener('click', () => {
        if (window.innerWidth <= 850 && sidebar.classList.contains('active')) {
            sidebar.classList.remove('active');
            if (toggleBtn) toggleBtn.innerText = "Members";
        }
    });

    // Handle File Upload Clicks
    document.getElementById("uploadDocBtn").onclick = () => document.getElementById("docInput").click();
    document.getElementById("uploadImgBtn").onclick = () => document.getElementById("imgInput").click();
</script>

</body>
</html>
