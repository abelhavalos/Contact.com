<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Messages – Contact.com</title>
<link rel="stylesheet" href="styles/messages.css" />
<style>
#input-area {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px;
  border-top: 1px solid #ddd;
  background: #fff;
}

.icon-btn {
  background: none;
  border: none;
  font-size: 20px;
  cursor: pointer;
  opacity: 0.7;
  transition: 0.2s;
}

.icon-btn:hover {
  opacity: 1;
}

#messageInput {
  flex: 1;
  padding: 10px;
  border-radius: 6px;
  border: 1px solid #ccc;
}
  .chat-loader {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  display: none;
  flex-direction: column;
  align-items: center;
  z-index: 9999;
}

.chat-loader .spinner {
  width: 40px;
  height: 40px;
  border: 4px solid rgba(255,255,255,0.25);
  border-top-color: #4da3ff;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  box-shadow: 0 0 12px #4da3ff;
}

.chat-loader .loading-text {
  margin-top: 10px;
  font-size: 14px;
  color: #4da3ff;
  text-shadow: 0 0 8px #4da3ff;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
..chat-avatar,
.chat-avatar-fallback {
  width: 44px !important;
  height: 44px !important;
  border-radius: 50% !important;
  object-fit: cover !important;
  display: block;
}

.msg-avatar,
.member-row img,
.chat-header img {
  width: 44px !important;
  height: 44px !important;
  border-radius: 50% !important;
  object-fit: cover !important;
  flex-shrink: 0;
}
  
.chat-avatar-fallback {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: #dbe4ff;
  color: #4a6cff;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
}
</style>
</head>

<body>

<nav class="navbar" id="navbar"></nav>
<div class="mobile-menu" id="mobileMenu"></div>

<div id="header">
  <span id="headerTitle"></span>
  <button id="toggleMembers" class="mobile-toggle">Members</button>
</div>
<div id="chatLoader" class="chat-loader">
  <div class="spinner"></div>
  <div class="loading-text">Loading conversation...</div>
</div>
<div id="chat-container">
  <div id="chat">
    <div id="messages">
  <div id="messageList"></div>
</div>

    <div id="input-area">
  <button id="uploadDocBtn" class="icon-btn">📎</button>
  <input type="file" id="docInput" accept=".pdf,.doc,.docx,.xls,.xlsx,.txt" style="display:none">

  <button id="uploadImgBtn" class="icon-btn">🖼️</button>
  <input type="file" id="imgInput" accept="image/*" style="display:none">

  <input id="messageInput" placeholder="Type a message..." />
  <button id="sendBtn">Send</button>
</div>
  </div>

  <div id="memberSidebar"></div>
</div>

<script src="scripts/messages.js"></script>
</body>
</html>
