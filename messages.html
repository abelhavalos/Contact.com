<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Messages | Contact.com</title>
    <link rel="stylesheet" href="styles/messages.css" />
    <style>
        /* Modern Theme Overrides */
        :root {
            --bg-dark: #0f172a;
            --accent-blue: #3b82f6;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
        }

        /* Input Area - Integrated Look */
        #input-area {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 20px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border-color);
        }

        #messageInput {
            flex: 1;
            padding: 12px 16px;
            background: var(--glass-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            color: white;
            outline: none;
            transition: border 0.3s ease;
        }

        #messageInput:focus {
            border-color: var(--accent-blue);
        }

        .icon-btn {
            background: var(--glass-bg);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            filter: grayscale(1); /* Matches tech icons better */
        }

        .icon-btn:hover {
            background: var(--accent-blue);
            filter: grayscale(0);
            transform: translateY(-2px);
        }

        #sendBtn {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        #sendBtn:hover {
            opacity: 0.9;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }

        /* Avatar Styling Consistency */
        .chat-avatar, .msg-avatar, .chat-header img, .member-row img {
            width: 44px !important;
            height: 44px !important;
            border-radius: 12px !important; /* Modern squircle instead of circle */
            object-fit: cover;
            border: 2px solid var(--border-color);
        }

        .chat-avatar-fallback {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Loader - Enhanced Glow */
        .chat-loader {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 9999;
        }

        .chat-loader .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(59, 130, 246, 0.1);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            filter: drop-shadow(0 0 10px var(--accent-blue));
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <nav class="navbar" id="navbar"></nav>
    <div class="mobile-menu" id="mobileMenu"></div>

    <div id="header" style="background: rgba(15, 23, 42, 0.9); border-bottom: 1px solid var(--border-color); padding: 15px 20px;">
        <span id="headerTitle" style="font-weight: 700; letter-spacing: -0.5px;"></span>
        <button id="toggleMembers" class="mobile-toggle">View Group</button>
    </div>

    <div id="chatLoader" class="chat-loader">
        <div class="spinner"></div>
        <div class="loading-text" style="margin-top: 15px; color: var(--accent-blue); font-weight: 500;">Syncing Messages...</div>
    </div>

    <div id="chat-container" style="display: flex; height: calc(100vh - 140px); background: transparent;">
        <div id="chat" style="flex: 1; display: flex; flex-direction: column;">
            <div id="messages" style="flex: 1; overflow-y: auto; padding: 20px;">
                <div id="messageList"></div>
            </div>

            <div id="input-area">
                <button id="uploadDocBtn" class="icon-btn" title="Upload Document">📎</button>
                <input type="file" id="docInput" accept=".pdf,.doc,.docx,.xls,.xlsx,.txt" style="display:none">

                <button id="uploadImgBtn" class="icon-btn" title="Upload Image">🖼️</button>
                <input type="file" id="imgInput" accept="image/*" style="display:none">

                <input id="messageInput" placeholder="Message your team..." />
                <button id="sendBtn">Send</button>
            </div>
        </div>

        <div id="memberSidebar" style="width: 280px; border-left: 1px solid var(--border-color); background: rgba(0,0,0,0.1);"></div>
    </div>

    <script src="scripts/messages.js"></script>
</body>
</html>
