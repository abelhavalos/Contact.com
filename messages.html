<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Messages – Contact.com</title>
    <link rel="stylesheet" href="styles/messages.css" />
    <style>
        /* SPINNER THEME */
        .chat-loader {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 9999;
        }

        .chat-loader .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(74, 108, 255, 0.1);
            border-top-color: #4a6cff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* INPUT AREA THEME */
        #input-area {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px;
            border-top: 1px solid #eee;
            background: #fff;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            opacity: 0.6;
            transition: 0.2s;
            padding: 0;
            display: flex;
            align-items: center;
        }

        .icon-btn:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        #messageInput {
            flex: 1;
            padding: 12px 15px;
            border-radius: 25px;
            border: 1px solid #ddd;
            outline: none;
            font-size: 14px;
        }

        #sendBtn {
            background: #4a6cff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        #sendBtn:hover {
            background: #3a56d6;
        }
    </style>
</head>

<body>

<nav class="navbar" id="navbar"></nav>
<div class="mobile-menu" id="mobileMenu"></div>

<div id="header">
    <div id="headerTitle" style="font-size: 18px; font-weight: 700;">Loading...</div>
    <button id="toggleMembers">Members</button>
</div>

<div id="chatLoader" class="chat-loader">
    <div class="spinner"></div>
    <div class="loading-text" style="margin-top:10px; color:#4a6cff; font-weight:500;">Connecting...</div>
</div>

<div id="chat-container">
    <main id="chat">
        <div id="messages">
            </div>

        <div id="input-area">
            <button id="uploadDocBtn" class="icon-btn" title="Upload Document">📎</button>
            <input type="file" id="docInput" accept=".pdf,.doc,.docx,.xls,.xlsx,.txt" style="display:none">

            <button id="uploadImgBtn" class="icon-btn" title="Upload Image">🖼️</button>
            <input type="file" id="imgInput" accept="image/*" style="display:none">

            <input id="messageInput" placeholder="Type a message..." autocomplete="off" />
            <button id="sendBtn">Send</button>
        </div>
    </main>

    <aside id="memberSidebar"></aside>
</div>

<script src="scripts/messages.js"></script>
</body>
</html>
